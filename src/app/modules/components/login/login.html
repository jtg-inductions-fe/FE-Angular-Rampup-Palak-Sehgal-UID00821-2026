<div class="auth__wrapper">
  <div class="auth__card">
    <h1 class="auth__title">Login</h1>
    <p class="auth__subtitle">Access to all the amazing articles</p>
    <form class="auth__form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Username -->
      <app-text-input
        label="Username"
        placeholder="Enter your username"
        [control]="username"
      ></app-text-input>
      <!-- Password Field -->
      <app-text-input label="Password" [control]="password" [isPassword]="true"></app-text-input>
      <app-button type="submit" [disabled]="loginForm.invalid || isLoading">Log In</app-button>
      <p class="auth__footer-text">
        Don't have an account?
        <a routerLink="/auth/register" class="auth__link">Sign Up</a>
      </p>
    </form>
  </div>
</div>
