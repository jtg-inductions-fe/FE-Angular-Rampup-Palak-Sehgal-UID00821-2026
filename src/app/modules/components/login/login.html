<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="auth-title">Login</h1>
    <p class="auth-subtitle">Access to all the amazing articles</p>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Username -->
      <app-text-input
        [control]="username"
        label="Username"
        placeholder="Enter your username"
      ></app-text-input>
      <!-- Password Field -->
      <app-text-input [control]="password" label="Password" [isPassword]="true"></app-text-input>
      <app-button type="submit" [disabled]="loginForm.invalid">Log In</app-button>
    </form>
  </div>
</div>
