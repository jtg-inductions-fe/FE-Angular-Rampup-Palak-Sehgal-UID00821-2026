<div class="auth-wrapper">
  <div class="auth-card">
    <h1 class="auth-title">Join our network.</h1>
    <p class="auth-subtitle">Create an account to start writing.</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Username Field -->
      <app-text-input
        [control]="$any(registerForm.get('username'))"
        label="Username"
        placeholder="Enter your username"
      ></app-text-input>

      <!-- Email Field -->
      <app-text-input
        [control]="$any(registerForm.get('email'))"
        label="Email"
        type="email"
        placeholder="Enter your email address"
      ></app-text-input>

      <!-- Password Field -->
      <app-text-input
        [control]="$any(registerForm.get('password'))"
        label="Password"
        [isPassword]="true"
      ></app-text-input>

      <!-- Confirm Password Field -->
      <app-text-input
        [control]="$any(registerForm.get('confirmPassword'))"
        label="Confirm Password"
        [isPassword]="true"
        placeholder="Confirm your password"
      ></app-text-input>

      <app-button type="submit" [disabled]="registerForm.invalid">Sign Up</app-button>
    </form>
  </div>
</div>
